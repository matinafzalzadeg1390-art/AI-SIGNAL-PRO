name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts not found. Upload the project files."; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/debug/app-debug.apk AISignal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AISignal-apk
          path: AISignal.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AISignal.apk
